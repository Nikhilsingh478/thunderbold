<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunderbold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #080808;
    overflow: hidden;
  }

  #tb-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #080808;
    overflow: hidden;
  }

  #bg-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  #vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse 70% 70% at center, transparent 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.92) 100%);
    pointer-events: none;
  }

  #scanlines {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
  }

  #center-stage {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    will-change: transform, opacity;
  }

  #bolt-icon {
    width: 44px;
    height: 72px;
    margin-bottom: 20px;
    will-change: transform, opacity, filter;
    opacity: 0;
    filter: blur(8px) drop-shadow(0 0 0px transparent);
    transform: scale(0.7) translateY(-10px);
    flex-shrink: 0;
  }

  #wordmark-wrap {
    position: relative;
    overflow: visible;
    line-height: 1;
  }

  #wordmark {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(38px, 8.2vw, 84px);
    letter-spacing: 0.15em;
    color: #FFFFFF;
    text-transform: uppercase;
    -webkit-text-stroke: 1.2px #FFFFFF;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    display: flex;
  }

  .char {
    display: inline-block;
    opacity: 0;
    will-change: transform, opacity, color;
  }

  #wipe-mask {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #080808 0%, #080808 50%, transparent 100%);
    transform: translateX(0%);
    pointer-events: none;
    z-index: 2;
  }

  #reveal-line {
    height: 2px;
    width: 0;
    margin-top: 14px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,195,0,0.6) 20%,
      #FFC300 40%,
      #FFFFFF 50%,
      #FFC300 60%,
      rgba(255,195,0,0.6) 80%,
      transparent 100%
    );
    background-size: 200% 100%;
    background-position: -100% 0;
    will-change: width, opacity;
    opacity: 1;
  }

  #tagline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(11px, 1.8vw, 16px);
    letter-spacing: 0.55em;
    color: rgba(255, 195, 0, 0.72);
    text-transform: uppercase;
    margin-top: 14px;
    opacity: 0;
    will-change: opacity;
  }

  #exit-mask {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #080808;
    opacity: 0;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    #bolt-icon { opacity: 1 !important; filter: none !important; transform: none !important; }
    .char { opacity: 1 !important; }
    #tagline { opacity: 1 !important; }
    #wipe-mask { display: none; }
    #bg-canvas { display: none; }
  }
</style>
</head>
<body>

<div id="tb-loader">
  <canvas id="bg-canvas"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <div id="center-stage">
    <svg id="bolt-icon" viewBox="0 0 44 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M26 0L0 42H18L12 72L44 26H24L26 0Z" fill="#FFC300"/>
    </svg>

    <div id="wordmark-wrap">
      <div id="wordmark"></div>
      <div id="wipe-mask"></div>
    </div>

    <div id="reveal-line"></div>
    <div id="tagline">Wear The Energy</div>
  </div>

  <div id="exit-mask"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function() {

  // ── CANVAS LIGHTNING SYSTEM ─────────────────────────────────────────────
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Grid
  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,185,0,0.028)';
    ctx.lineWidth = 0.5;
    const cell = 60;
    for (let x = 0; x <= W; x += cell) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += cell) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  // Lightning bolt objects
  const bolts = [];

  function rnd(min, max) { return Math.random() * (max - min) + min; }

  // Recursive bolt path collector
  function collectBoltSegments(x1, y1, x2, y2, depth, displacement, segments, isMain) {
    if (depth === 0) {
      segments.push({ x1, y1, x2, y2, main: isMain });
      return;
    }
    const mx = (x1 + x2) / 2 + rnd(-displacement, displacement);
    const my = (y1 + y2) / 2 + rnd(-displacement / 3.5, displacement / 3.5);
    collectBoltSegments(x1, y1, mx, my, depth - 1, displacement * 0.52, segments, isMain);
    collectBoltSegments(mx, my, x2, y2, depth - 1, displacement * 0.52, segments, isMain);
    if (Math.random() < 0.38) {
      const bx = mx + rnd(-70, 70);
      const by = my + rnd(25, 90);
      collectBoltSegments(mx, my, bx, by, Math.max(depth - 2, 0), displacement * 0.4, segments, false);
    }
  }

  function spawnBolt(fromX, fromY, toX, toY, forced) {
    const segments = [];
    collectBoltSegments(fromX, fromY, toX, toY, 5, 85, segments, true);
    bolts.push({
      segments,
      opacity: 1,
      decay: rnd(0.035, 0.065),
      forced: !!forced
    });
  }

  function triggerIconBolt() {
    const stage = document.getElementById('center-stage');
    const bolt = document.getElementById('bolt-icon');
    const bRect = bolt.getBoundingClientRect();
    const ox = bRect.left + bRect.width / 2;
    const oy = bRect.top + bRect.height;
    const variants = 3;
    for (let i = 0; i < variants; i++) {
      setTimeout(() => {
        spawnBolt(ox + rnd(-10, 10), oy, ox + rnd(-120, 120), oy + rnd(H * 0.3, H * 0.6), true);
      }, i * 40);
    }
  }

  // Sheet lightning flash state
  let sheetFlash = 0;
  let nextSheet = rnd(800, 2000);
  let lastSheetTime = 0;

  // Particles
  const particles = [];
  for (let i = 0; i < 55; i++) {
    particles.push({
      x: rnd(0, 1),
      y: rnd(0, 1),
      r: rnd(0.8, 1.9),
      vy: rnd(0.1, 0.38),
      vx: rnd(-0.12, 0.12),
      a: rnd(0.12, 0.48)
    });
  }

  function drawBolts() {
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.opacity -= b.decay;
      if (b.opacity <= 0) { bolts.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = b.opacity;

      // Afterglow pass
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = `rgba(255,195,0,0.06)`;
      ctx.lineCap = 'round';
      b.segments.forEach(s => {
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      });

      // Main pass
      b.segments.forEach(s => {
        ctx.lineWidth = s.main ? 1.6 : 0.75;
        ctx.strokeStyle = s.main
          ? `rgba(255,200,0,${0.85 * b.opacity})`
          : `rgba(255,195,0,${0.42 * b.opacity})`;
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      });

      ctx.restore();
    }
  }

  function drawParticles() {
    particles.forEach(p => {
      p.y -= p.vy / H * 60;
      p.x += p.vx / W * 60;
      if (p.y < -0.01) { p.y = 1.01; p.x = Math.random(); }
      if (p.x < -0.01) p.x = 1.01;
      if (p.x > 1.01) p.x = -0.01;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,195,0,${p.a * 0.7})`;
      ctx.fill();
    });
  }

  let lastTime = 0;
  let nextBolt = rnd(120, 400);
  let elapsed = 0;
  let canvasAlive = true;
  let canvasOpacity = 1;

  function frame(ts) {
    if (!canvasAlive) return;
    const dt = ts - lastTime;
    lastTime = ts;
    elapsed += dt;

    ctx.clearRect(0, 0, W, H);

    // Sheet lightning
    if (elapsed - lastSheetTime > nextSheet) {
      ctx.save();
      ctx.globalAlpha = 0.018;
      ctx.fillStyle = '#FFC300';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      lastSheetTime = elapsed;
      nextSheet = rnd(700, 2100);
    }

    drawGrid();
    drawParticles();
    drawBolts();

    // Random bolt spawn
    if (elapsed > nextBolt) {
      const side = Math.random();
      let sx, sy, ex, ey;
      if (side < 0.6) {
        sx = rnd(W * 0.1, W * 0.9); sy = 0;
        ex = sx + rnd(-W * 0.3, W * 0.3); ey = rnd(H * 0.4, H * 0.9);
      } else {
        sx = Math.random() < 0.5 ? rnd(-20, 0) : rnd(W, W + 20);
        sy = rnd(0, H * 0.4);
        ex = W / 2 + rnd(-W * 0.3, W * 0.3);
        ey = rnd(H * 0.3, H * 0.8);
      }
      spawnBolt(sx, sy, ex, ey);
      nextBolt = elapsed + rnd(160, 580);
    }

    canvas.style.opacity = canvasOpacity;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── WORDMARK CHARACTER SPLIT ─────────────────────────────────────────────
  const word = 'THUNDERBOLD';
  const wm = document.getElementById('wordmark');
  const chars = [];
  word.split('').forEach(ch => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch;
    wm.appendChild(span);
    chars.push(span);
  });

  // ── GSAP MASTER TIMELINE ─────────────────────────────────────────────────
  const tl = gsap.timeline({ onComplete: () => {
    document.getElementById('tb-loader').style.display = 'none';
    document.dispatchEvent(new CustomEvent('thunderbold:loaderDone'));
  }});

  // t=0.00 — Bolt icon entrance
  tl.to('#bolt-icon', {
    opacity: 1,
    filter: 'blur(0px) drop-shadow(0 0 0px transparent)',
    scale: 1,
    y: 0,
    duration: 0.5,
    ease: 'back.out(1.4)'
  }, 0);

  // t=0.55 — Glow BUILD
  tl.to('#bolt-icon', {
    filter: 'blur(0px) drop-shadow(0 0 5px #FFC300) drop-shadow(0 0 14px rgba(255,195,0,0.55))',
    duration: 0.15,
    ease: 'power2.in'
  }, 0.55);

  // t=0.70 — Glow PEAK — electric discharge
  tl.to('#bolt-icon', {
    filter: 'blur(0px) drop-shadow(0 0 22px #FFC300) drop-shadow(0 0 45px rgba(255,195,0,0.9)) drop-shadow(0 0 90px rgba(255,195,0,0.35))',
    duration: 0.1,
    ease: 'power4.out',
    onStart: triggerIconBolt
  }, 0.70);

  // t=0.80 — Glow SETTLE
  tl.to('#bolt-icon', {
    filter: 'blur(0px) drop-shadow(0 0 7px rgba(255,195,0,0.45))',
    duration: 0.35,
    ease: 'power2.out'
  }, 0.80);

  // t=0.70 — Wipe mask sweeps right revealing wordmark
  tl.to('#wipe-mask', {
    xPercent: 150,
    duration: 0.42,
    ease: 'power4.out'
  }, 0.70);

  // t=0.70 — Character stagger fade in
  tl.to(chars, {
    opacity: 1,
    duration: 0.28,
    stagger: 0.032,
    ease: 'none'
  }, 0.70);

  // t=0.70 — Random char gold sparks
  chars.forEach((ch, i) => {
    if (Math.random() < 0.30) {
      const delay = 0.70 + i * 0.032 + 0.01;
      tl.to(ch, { color: '#FFC300', duration: 0.05, ease: 'none' }, delay)
        .to(ch, { color: '#FFFFFF', duration: 0.07, ease: 'none' }, delay + 0.05);
    }
  });

  // t=1.30 — Reveal line expand
  const rl = document.getElementById('reveal-line');
  tl.to(rl, {
    width: () => document.getElementById('wordmark').offsetWidth,
    duration: 0.38,
    ease: 'power4.inOut'
  }, 1.30);

  // t=1.60 — Shimmer sweep
  tl.to(rl, {
    backgroundPosition: '200% 0',
    duration: 0.35,
    ease: 'power2.inOut'
  }, 1.60);

  // t=1.82 — Reveal line fades
  tl.to(rl, { opacity: 0, duration: 0.38, ease: 'power2.in' }, 1.82);

  // t=1.55 — Tagline
  tl.to('#tagline', { opacity: 1, duration: 0.62, ease: 'power2.out' }, 1.55);

  // t=2.28 — Center stage exit
  tl.to('#center-stage', {
    y: -14,
    opacity: 0,
    duration: 0.42,
    ease: 'power3.in',
    onStart: () => {
      document.getElementById('tb-loader').style.pointerEvents = 'none';
    }
  }, 2.28);

  // t=2.38 — Canvas fade
  tl.to({}, {
    duration: 0.45,
    onStart: () => {
      gsap.to(canvas, { opacity: 0, duration: 0.45 });
    }
  }, 2.38);

  // t=2.48 — Exit overlay
  tl.to('#exit-mask', { opacity: 1, duration: 0.52, ease: 'power2.in' }, 2.48);

  // t=3.05 — Done
  tl.to({}, { duration: 0.05 }, 3.05);

  // ── REDUCED MOTION OVERRIDE ──────────────────────────────────────────────
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    tl.kill();
    canvasAlive = false;
    canvas.style.display = 'none';
    gsap.set('#bolt-icon', { opacity: 1, filter: 'drop-shadow(0 0 7px rgba(255,195,0,0.5))', scale: 1, y: 0 });
    gsap.set(chars, { opacity: 1 });
    gsap.set('#tagline', { opacity: 1 });
    gsap.set('#wipe-mask', { xPercent: 150 });
    setTimeout(() => {
      gsap.to('#exit-mask', { opacity: 1, duration: 0.4, onComplete: () => {
        document.getElementById('tb-loader').style.display = 'none';
        document.dispatchEvent(new CustomEvent('thunderbold:loaderDone'));
      }});
    }, 800);
  }

})();
</script>
</body>
</html>
