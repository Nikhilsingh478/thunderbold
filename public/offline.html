<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Thunderbold — You're Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #ffffff;
        font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        text-align: center;
        padding: 2rem;
      }

      .bolt {
        width: 64px;
        height: 64px;
        margin-bottom: 2rem;
        opacity: 0.9;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #D4AA30;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.45);
        max-width: 280px;
        line-height: 1.6;
        margin-bottom: 2.5rem;
      }

      button {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: rgba(255,255,255,0.7);
        padding: 0.85rem 2rem;
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }

      button:hover {
        border-color: #D4AA30;
        color: #D4AA30;
      }
    </style>
  </head>
  <body>
    <svg class="bolt" viewBox="0 0 718 820" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 465 104 L 150 490 L 352 492 L 226 790 L 604 376 L 604 374 L 378 374 L 354 436 L 446 437 L 403 498 L 402 496 L 418 450 L 331 449 Z" fill="#F8C80A"/>
      <path d="M 445 139 L 164 483 L 359 483 L 362 486 L 247 759 L 589 381 L 383 381 L 365 429 L 456 429 L 459 432 L 379 545 L 378 539 L 409 458 L 324 457 L 322 455 Z" fill="#FEFEFE"/>
    </svg>

    <h1>You're Offline</h1>
    <p>Check your connection and try again. Your cart and wishlist are saved locally.</p>

    <button onclick="window.location.reload()">Try Again</button>
  </body>
</html>
